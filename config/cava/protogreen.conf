# cava — PROTO//GREEN showcase scene (fullscreen terminal "busy shot")
[general]
bars = 0
bar_width = 2
bar_spacing = 1
framerate = 60
autosens = 1

[input]
method = pulse
source = auto

[output]
method = ncurses
channels = stereo
mono_option = average

[color]
background = '#0a0f0b'
gradient = 1
gradient_count = 6
gradient_color_1 = '#29a440'
gradient_color_2 = '#47f154'
gradient_color_3 = '#98f79c'
gradient_color_4 = '#3cd983'
gradient_color_5 = '#78e3dc'
gradient_color_6 = '#f35beb'

[smoothing]
noise_reduction = 0.45
monstercat = 1
waves = 0
gravity = 110
