general {
    lock_cmd = pidof hyprlock || hyprlock   # only for MANUAL lock (SUPER+L); kept
    # before_sleep_cmd lock disabled by request — no auto-lock, even on suspend/resume
    after_sleep_cmd = hyprctl dispatch dpms on
}

# the visor gets sleepy ~30s before the lock (eyes droop), wakes on activity
listener {
    timeout = 570
    on-timeout = qs -c protogreen ipc call visor sleep
    on-resume = qs -c protogreen ipc call visor wake
}

