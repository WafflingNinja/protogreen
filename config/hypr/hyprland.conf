################
### MONITOR  ###
################
# >>> PROTOGREEN MONITOR >>>  (install.sh rewrites this line for your panel)
# eDP-1: ASUS internal panel 1920x1080@144Hz. Wrong for your machine? Edit it,
# or delete it — the fallback below drives any output at its preferred mode.
monitor = eDP-1,1920x1080@144,0x0,1
# <<< PROTOGREEN MONITOR <<<
# fallback for any other output
monitor = ,preferred,auto,1

#####################
### GPU PROFILE    ###
#####################
# Everything between the markers is HARDWARE-SPECIFIC and is rewritten by
# install.sh for your machine (nvidia-hybrid / amd / intel). Copying by hand?
# Delete the lines that don't match your GPU — they are all additive env vars,
# so removing them is always safe.
# >>> PROTOGREEN GPU PROFILE >>> nvidia-hybrid
# Intel UHD + NVIDIA RTX 2050. Wayland env vars.
# LIBVA=iHD: panel is Intel-driven, so video DECODE belongs on the iGPU (nvidia libva
# fell back to SOFTWARE decode here = worse + wakes the dGPU = battery drain). 2026-07-27.
env = LIBVA_DRIVER_NAME,iHD
# read by scripts/power-watch.sh — pins mpvpaper's VA driver to match
env = PROTOGREEN_VAAPI,iHD
# GLX stays nvidia on purpose: Xwayland GAMES want the dGPU. NVD_BACKEND now inert.
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
# <<< PROTOGREEN GPU PROFILE <<<
# mesa_glthread: threaded GL dispatch, small throughput win for mesa GL clients
# (Intel AND AMD). Vendor-neutral, so it lives outside the profile block.
env = mesa_glthread,true
env = ELECTRON_OZONE_PLATFORM_HINT,auto
# toolkit backends
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
# Bibata-Modern-Ice: STATIC cursor. Was miku-cursor-linux, but Miku's left_ptr has
# 8 animation frames → constant KMS cursor-buffer re-upload = stutter on the Intel
# plane. Static = smooth. (xcursor only; hyprcursor falls back.)
env = XCURSOR_THEME,Bibata-Modern-Ice

# Panel is wired to the Intel iGPU (eDP-1 on card1/i915), not NVIDIA — so the HW
# cursor plane is Intel's and does NOT double. Use it: HW cursor = buttery, zero
# per-frame CPU cost. (The old SW-cursor workaround was only needed for NVIDIA scanout.)

#####################
### AUTOSTART      ###
#####################
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# polkit auth agent: GTK polkit-gnome (~8MB) instead of hyprpolkitagent (Qt6, ~145MB). 2026-07-27, saves ~137MB.
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# boot password: SDDM autologins (no burn-in greeter), hyprlock gates the session
exec-once = hyprlock
# Wallpaper + power profile owned by power-watch.sh: launches the LIGHT video
# wallpaper (mpvpaper, Intel iHD/vulkan decode, ~220MB) on AC + battery, kills it
# during games (frees the iGPU). Profile = balanced on AC / power-saver on battery
# (unless a manual pick via the waybar/visor power button).
exec-once = __HOME__/.config/hypr/scripts/power-watch.sh
# auto-dismiss the "started without start-hyprland" nag (session execs bare Hyprland; harmless)
exec-once = sleep 3 && hyprctl dismissnotify -1
# clear the frozen SDDM ghost cursor (NVIDIA handoff) — dpms toggle forces cursor-plane redraw
exec-once = sleep 3 && hyprctl dispatch dpms off && sleep 3 && hyprctl dispatch dpms on && hyprctl dispatch movecursor 960 540
# PROTO//GREEN visor bar (quickshell). waybar kept as fallback — SUPER+SHIFT+B toggles.
exec-once = qs -c protogreen
exec-once = dunst
exec-once = hypridle
# rice sounds: sci-fi blips on window open/close + workspace switch (Kenney CC0 pack)
exec-once = __HOME__/.config/hypr/scripts/hypr-sound-listener.sh
# nm-applet / blueman-applet dropped — waybar's network + bluetooth modules replace them (saves RAM)
# hyprpm plugins. They do NOT survive a Hyprland update: rerun `hyprpm update`
# after upgrading.
exec-once = hyprpm reload -n
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# vnc disabled - using Sunshine/Moonlight instead
# exec-once = wayvnc -g -r

#####################
### LOOK & FEEL    ###
#####################
# palette — refined green (glam)
$bg        = rgb(0a0f0c)
$surface   = rgb(13201a)
$green     = rgb(39ff6a)
$greenbri  = rgb(90ffa8)
$green2    = rgb(1fae52)
$teal      = rgb(2fe6a0)
$fg        = rgb(d4f5df)
$muted     = rgb(4f8f68)

general {
    gaps_in = 8
    gaps_out = 18
    border_size = 2
    # 3-stop green→teal gradient. NOTE: this is a STATIC gradient — a looping
    # `borderangle` rotation was deliberately NOT added: it repaints the border
    # every frame, the exact continuous-iGPU load that caused the choppiness we
    # already fought (see blur note below). Brighter lead stop = more pop, free.
    col.active_border = $greenbri $green2 $teal 45deg
    col.inactive_border = rgba(1a2420aa)
    resize_on_border = true
    # tearing: lets fullscreen games present without waiting for vsync (lower latency).
    # Only engages for FULLSCREEN windows with an `immediate` rule (see WINDOW RULES).
    allow_tearing = true
    layout = dwindle
}

# NOTE: render:explicit_sync / explicit_sync_kms removed in Hyprland 0.55 —
# explicit sync is automatic now. (Gemini copied these from an old guide.)

decoration {
    rounding = 14
    # squircle corners (iOS-style) — purely changes the corner curve math, zero
    # extra per-frame cost. Softer/glammer than the default circular rounding.
    rounding_power = 2.2
    active_opacity = 1.0
    inactive_opacity = 0.82
    # subtle depth on unfocused windows — static overlay, computed once per focus
    # change (NOT per frame), so it's cheap on the iGPU. Pairs with the opacity drop.
    dim_inactive = true
    dim_strength = 0.15
    dim_special = 0.3

    # BLUR OFF — the real choppiness cause. On this box the Intel iGPU does ALL
    # compositing, and blur must RE-RUN over the moving wallpaper every single
    # frame for each transparent surface → iGPU saturates → choppy everything
    # (even the HW cursor). Verified live: animated wallpaper + blur = choppy;
    # same wallpaper + blur OFF = "a lot lot smoother". Kept transparency +
    # animations + shadows for the glam look — those are cheap (transient/static).
    # BLUR ON (re-enabled by request). The old choppiness was blur re-running over
    # the MOVING wallpaper every frame on the iGPU. Now mitigated: power-watch.sh
    # pauses the wallpaper during games and uses a STATIC wallpaper on battery, so
    # blur only ever fights the animated wallpaper on the plugged-in idle desktop.
    # Kept light for the UHD: size 4 / passes 2. If the AC desktop feels choppy,
    # either drop passes to 1, or set the wallpaper to static permanently.
    blur {
        # OFF again 2026-07-27 (4th time). User explicitly chose "keep the animated
        # wallpaper, no blur" — and blur must RE-RUN over that moving wallpaper every
        # frame on the Intel UHD, which is the verified choppiness cause. Everything
        # else that makes the rice look alive (animations, rounding, shadows,
        # transparency, dim) is CHEAP and stays on. Only turn this back on if the
        # wallpaper ever becomes static.
        enabled = false
        size = 2
        passes = 1
        new_optimizations = true
        ignore_opacity = true
        xray = true
        special = true
        popups = true
    }

    # green-tinted depth shadow (static per window = cheap, kept). Bigger range +
    # softer falloff = floatier glam glow without any per-frame work. Sharpness
    # stays low so it reads as a halo, not a hard drop shadow.
    shadow {
        enabled = true
        range = 14
        render_power = 3
        sharp = false
        color = rgba(39ff6a45)
        color_inactive = rgba(0a0f0c33)
    }
}

cursor {
    # SW cursors ALWAYS on. Roblox/Sober renders on the NVIDIA dGPU via PRIME
    # offload, where the HW cursor plane breaks locked/relative pointer (camera
    # stuck looking one way). Toggling to true only at launch left a grab-time
    # race where Sober latched the pointer while HW cursor was still active →
    # camera stuck on fresh launches. Keeping it always-true kills that race.
    # Tradeoff: slightly choppier desktop cursor on the weak UHD iGPU. (Ref:
    # Hyprland issue #9268.)
    no_hardware_cursors = true
    # cursor:sync_fps does not exist in 0.55 — removed.
}

animations {
    # Improved fluid beziers
    bezier = fluent_decel, 0, 0.2, 0.4, 1
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15

    # Animation definitions
    animation = windows, 1, 4, overshot, popin 60%
    animation = windowsIn, 1, 4, overshot, popin 60%
    animation = windowsOut, 1, 3, md3_accel, popin 60%
    animation = windowsMove, 1, 3, md3_decel, slide
    animation = border, 1, 10, default
    # borderangle LOOP disabled 2026-07-27. The `loop` variant repaints the focused
    # border EVERY frame forever = continuous iGPU load with nothing on screen moving.
    # This was previously identified as the #1 choppiness cause and it had crept back.
    # Border still animates on focus change (the `border` line above); only the
    # never-ending rotation is gone. Re-add `, loop` if you want the spin back.
    animation = borderangle, 0, 100, linear
    animation = fade, 1, 3, md3_decel
    animation = layers, 1, 3, md3_decel, popin 60%
    animation = workspaces, 1, 4.2, md3_decel, slide
    animation = workspacesIn, 1, 4.2, md3_decel, slide
    animation = workspacesOut, 1, 4.2, md3_decel, slide
    animation = specialWorkspace, 1, 4, overshot, slidevert
}

dwindle {
    # pseudotile removed as config var in 0.53+; use dispatcher (bind SUPER+P, pseudo)
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    # misc:vfr removed in 0.55 (always on now).
    # VRR = 2 (fullscreen-only). Was 1 (always): always-on VRR drops the panel to a
    # low refresh when the desktop is static, which made the HW cursor move at that
    # low Hz = laggy/janky cursor. 2 keeps the DESKTOP locked at full 144Hz (smooth
    # cursor) while still giving fullscreen games adaptive sync. Set 0 if the panel
    # flickers in fullscreen; set 1 only if you want windowed-game VRR back.
    vrr = 0
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    font_family = JetBrainsMono Nerd Font
}

input {
    kb_layout = cz
    kb_variant = qwerty
    # 0 (click-to-focus), NOT 1. With follow_mouse=1, Roblox/Sober's mouse-lock
    # warps the cursor and focus chased it off the window → pointer-lock dropped →
    # camera couldn't rotate (only arrow keys worked). 0 keeps focus on the game
    # while it holds the pointer. Tradeoff: hover no longer focuses windows, you
    # click to focus. (Use 2 if you want hover-focus back and it still works.)
    follow_mouse = 0
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
    }
}

gestures {
    gesture = 3, horizontal, workspace
}

#####################
### WINDOW RULES   ###
#####################
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on
# media / viewers / utilities float (#16)
windowrule = match:class ^(mpv|com.github.rafostar.Clapper|imv|org.kde.gwenview|feh)$, float on
windowrule = match:class ^(org.gnome.Calculator|galculator|org.kde.kcalc)$, float on
windowrule = match:class ^(file-roller|org.gnome.FileRoller|xarchiver)$, float on
windowrule = match:class ^(org.pulseaudio.pavucontrol|com.saivert.pwvucontrol)$, float on
# common dialogs float
windowrule = match:title ^(Open File|Save File|Save As|Choose Files|Open Folder|File Operation Progress|Confirm to replace files)$, float on
# Picture-in-Picture: float + pin + small
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:title ^(Picture-in-Picture)$, size 480 270
# screencast picker: default size clips its Share button
windowrule = match:class ^(hyprland-share-picker)$, float on
windowrule = match:class ^(hyprland-share-picker)$, size 900 700
windowrule = match:class ^(hyprland-share-picker)$, center on

windowrule = match:class ^(autoclicker)$, float on
windowrule = match:class ^(autoclicker)$, size 500 400
windowrule = match:class ^(autoclicker)$, center on
windowrule = match:class .*, suppress_event maximize
# blur is for layers (bar/rofi/notifs) only — windows excluded, keeps iGPU cost tiny
windowrule = match:class .*, no_blur on

# transparency rules (synthwave vibe) — new 0.55 match: syntax
windowrule = match:class ^(kitty)$, opacity 0.94 0.86
windowrule = match:class ^(thunar)$, opacity 0.94 0.86
windowrule = match:class ^(code-oss)$, opacity 0.94 0.86
windowrule = match:class ^(discord)$, opacity 0.94 0.86
windowrule = match:class ^(WebCord)$, opacity 0.94 0.86
windowrule = match:class ^(Vesktop)$, opacity 0.94 0.86
windowrule = match:class ^(rofi)$, animation popin 85%

# fix occasional dragging glitch on some XWayland apps
windowrule = match:class ^$ match:title ^$ match:xwayland 1 match:floating 1 match:fullscreen 0 match:pinned 0, no_focus on

# games: tearing/immediate present (only active when fullscreen). Windowed smoothness
# comes from VRR (misc:vrr=1) above; these help when you DO go fullscreen.
windowrule = match:class ^(org\.vinegarhq\.Sober)$, immediate on
windowrule = match:class ^(steam_app_\d+)$, immediate on
windowrule = match:class ^(gamescope)$, immediate on

windowrule = match:class ^(konqi-pet)$, float on
windowrule = match:class ^(konqi-pet)$, no_focus off
windowrule = match:class ^(konqi-pet)$, border_size 0
windowrule = match:class ^(konqi-pet)$, no_shadow on
windowrule = match:class ^(konqi-pet)$, no_anim on
#####################
### LAYER BLUR     ###
#####################
layerrule = match:namespace rofi, blur on
layerrule = match:namespace rofi, ignore_alpha 0.3
# bars NOT blurred — persistent surface + video wallpaper = re-blur every frame
# (the choppiness). Transient surfaces (rofi/notifs/HUD) only cost while visible.
layerrule = match:namespace ^(protogreen-hud)$, blur on
layerrule = match:namespace ^(protogreen-hud)$, ignore_alpha 0.2
layerrule = match:namespace notifications, blur on

#####################
### KEYBINDS       ###
#####################
$mainMod = SUPER
$term = kitty
$filemgr = thunar
$menu = rofi -show drun

bind = $mainMod, Q, exec, $term
bind = $mainMod, E, exec, $filemgr
bind = $mainMod, R, exec, $menu
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, L, exec, ~/.config/hypr/scripts/play-sound.sh lock; hyprlock; ~/.config/hypr/scripts/play-sound.sh unlock
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, SPACE, exec, $menu
# tap lone SUPER -> launcher (note: also fires after releasing any SUPER+key combo)
bindr = SUPER, SUPER_L, exec, pkill rofi || rofi -show drun
# clipboard history
bind = $mainMod, H, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# move windows (within workspace)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# slide active window to prev/next workspace (and follow it)
bind = $mainMod CTRL, right, movetoworkspace, +1
bind = $mainMod CTRL, left, movetoworkspace, -1
# same without following (window leaves, you stay)
bind = $mainMod CTRL SHIFT, right, movetoworkspacesilent, +1
bind = $mainMod CTRL SHIFT, left, movetoworkspacesilent, -1

# workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# move to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# scratchpad (special workspace)
bind = $mainMod, S, togglespecialworkspace, magic
# SHIFT+S taken by region screenshot — CTRL+S sends window to scratchpad
bind = $mainMod CTRL, S, movetoworkspace, special:magic


# keyboard resize
binde = $mainMod ALT, left, resizeactive, -40 0
binde = $mainMod ALT, right, resizeactive, 40 0
binde = $mainMod ALT, up, resizeactive, 0 -40
binde = $mainMod ALT, down, resizeactive, 0 40

# cycle windows on workspace
bind = $mainMod, Tab, cyclenext,
bind = $mainMod, Tab, bringactivetotop,
bind = $mainMod SHIFT, Tab, cyclenext, prev

# scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# mouse drag
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# screenshots (grim + slurp + satty annotate, auto-copies)
bind = $mainMod SHIFT, S, exec, __HOME__/.config/hypr/scripts/screenshot.sh region
bind = $mainMod SHIFT, W, exec, __HOME__/.config/hypr/scripts/screenshot.sh window
bind = , Print, exec, __HOME__/.config/hypr/scripts/screenshot.sh full

# clipboard history menu lives on SUPER+H (V = togglefloating)
# color picker -> copies hex (#11)
bind = $mainMod SHIFT, C, exec, hyprpicker -a
# emoji picker (#12)
bind = $mainMod SHIFT, E, exec, rofi -show emoji -modi emoji
# night light toggle (#15)
bind = $mainMod SHIFT, N, exec, pkill hyprsunset || hyprsunset -t 4000
# bar toggle: quickshell visor bar <-> waybar fallback
bind = $mainMod SHIFT, B, exec, __HOME__/.config/hypr/scripts/bartoggle.sh
# HUD dashboard toggle (quickshell IPC)
bind = $mainMod, D, exec, qs -c protogreen ipc call hud toggle
# theme panel — colour wheel, customize sliders, wallpaper grid (also HUD → theme)
bind = $mainMod SHIFT, T, exec, qs -c protogreen ipc call theme toggle
# NULL assistant popup toggle (quickshell IPC)
bind = $mainMod, A, exec, qs -c protogreen ipc call ai toggle
# crosshair overlay toggle (quickshell IPC) — bare F4 steals the key globally, so it never
# reaches games; if some game needs its own F4 binding, this will conflict with it
bind = , F4, exec, qs -c protogreen ipc call crosshair toggle
# PROTO//GREEN showcase scene (fastfetch + green cava) for the unixporn shot
bind = $mainMod SHIFT, A, exec, kitty -e __HOME__/.config/hypr/scripts/showcase.sh

# autoclicker: F8 or SUPER+ALT+C toggles it with the settings saved from the popup
bind = , F8, exec, __HOME__/.config/hypr/scripts/autoclicker.py --config
bind = $mainMod ALT, C, exec, __HOME__/.config/hypr/scripts/autoclicker.py --config
# settings popup
bind = $mainMod ALT, X, exec, __HOME__/.config/hypr/scripts/autoclicker_gui.py

# media / volume / brightness
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5 && ~/.config/hypr/scripts/play-sound.sh volume 80
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5 && ~/.config/hypr/scripts/play-sound.sh volume 80
bindl  = , XF86AudioMute, exec, pamixer -t && ~/.config/hypr/scripts/play-sound.sh volume 80
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set 5%+ && ~/.config/hypr/scripts/play-sound.sh volume 80
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && ~/.config/hypr/scripts/play-sound.sh volume 80


# ── theme panel (SUPER+D → theme) ──
# Generated colours/geometry. Sourced LAST so it overrides the look & feel
# keys above; every other setting in this file is unaffected.
source = ~/.config/hypr/theme.conf
