# ╔══════════════════════════════════════════════╗
# ║  hyprlock — PROTO//GREEN visor lock            ║
# ╚══════════════════════════════════════════════╝

$green    = rgb(47f154)
$greenbri = rgb(98f79c)
$teal     = rgb(3cd983)
$fg       = rgb(d6f3db)
$bg       = rgb(0a0f0b)
$muted    = rgb(538b60)

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = __HOME__/.config/protogreen/lock-bg.png
    blur_passes = 4
    blur_size = 10
    noise = 0.012
    contrast = 0.92
    brightness = 0.40
    vibrancy = 0.12
    vibrancy_darkness = 0.1
}

# ── dark vignette so widgets pop ──
shape {
    monitor =
    size = 2200, 1400
    color = rgba(0a0f0b66)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
}

# ── thin teal scanline under the input row (console accent) ──
shape {
    monitor =
    size = 320, 2
    color = rgba(3cd98344)
    rounding = 2
    border_size = 0
    position = 0, -108
    halign = center
    valign = center
}

# ── big clock — neon, green glow ──
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = $greenbri
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 180
    halign = center
    valign = center
    shadow_passes = 3
    shadow_size = 8
    shadow_color = rgba(47f15455)
}

# ── date ──
label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = $teal
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 95
    halign = center
    valign = center
}

# ── protogen visor accent ──
label {
    monitor =
    text = ◕▿◕
    color = $green
    font_size = 26
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 30
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(47f15440)
}

# ── input field ──
input-field {
    monitor =
    size = 300, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.35
    dots_center = true
    outer_color = $green
    inner_color = rgba(141f18cc)
    font_color = $fg
    fade_on_empty = false
    rounding = 14
    placeholder_text = <span foreground="##538b60">◕  unlock proto//green</span>
    check_color = $teal
    capslock_color = $greenbri
    fail_color = rgb(f85149)
    fail_text = <span foreground="##f85149">✖ $ATTEMPTS</span>
    fail_transition = 220
    position = 0, -50
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(47f15440)
}

# ── battery + layout footer ──
label {
    monitor =
    text = cmd[update:30000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -1)%   |   $(date +%Z)"
    color = $muted
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}

# ── user host bottom-left ──
label {
    monitor =
    text = cmd[update:3600000] echo "$(whoami)@$(hostname)"
    color = $muted
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 30, 30
    halign = left
    valign = bottom
}
