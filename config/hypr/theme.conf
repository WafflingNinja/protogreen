# ── GENERATED by theme_apply.py — do not edit, edit the theme panel ──
# Sourced at the end of hyprland.conf: last write wins, so only these keys are
# owned by the theme. Everything else in hyprland.conf stays yours.
general {
    gaps_in = 8
    gaps_out = 18
    col.active_border = rgb(92f79a) rgb(27a031) rgb(60d283) 45deg
    col.inactive_border = rgba(1a261baa)
}

decoration {
    rounding = 14
    active_opacity = 1.0
    inactive_opacity = 0.86
    blur {
        enabled = false
        size = 1
        passes = 1
    }
    shadow {
        color = rgba(41f14f45)
        color_inactive = rgba(090e0a33)
    }
}

animations {
    enabled = true
    bezier = themeEase, 0.16, 1, 0.3, 1
    animation = windows,     1, 5, themeEase, popin 80%
    animation = fade,        1, 4, themeEase
    animation = workspaces,  1, 4, themeEase, slide
    animation = layers,      1, 4, themeEase, fade
}
