# cava feed for the PROTO//GREEN visor bar (raw ascii -> stdout, parsed by Cava.qml)
[general]
bars = 12
framerate = 20
autosens = 1
overshoot = 0

[input]
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 0.55
